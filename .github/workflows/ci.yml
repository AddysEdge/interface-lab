name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Build-only placeholders. This workflow never uses real Clerk/Supabase credentials.
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PREVIEW_BROWSER_CHANNEL: 'chrome'
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: 'pk_test_YnVpbGQtb25seS5jbGVyay5hY2NvdW50cy5kZXYk'
      CLERK_SECRET_KEY: 'sk_test_ci_placeholder_not_a_key'
      NEXT_PUBLIC_SUPABASE_URL: 'https://example.invalid'
      NEXT_PUBLIC_SUPABASE_KEY: 'ci_placeholder_not_a_key'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Regression tests (mocked data layer)
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Production build
        run: npm run build
      - name: Check the server-rendered build and capture its preview
        timeout-minutes: 2
        run: npm run preview:check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: homepage-preview
          path: artifacts/
          if-no-files-found: error

  # The current InterfaceLab app (workshop/). Offline checks only: no login,
  # no credentials, no billable integration calls. The vitest suite needs the
  # registered app id that `npx deepspace app init` writes to workshop/wrangler.toml.
  workshop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workshop
    env:
      DEEPSPACE_TEST_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workshop/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Unit, permission and server-action tests (integrations mocked)
        run: npm run test:unit
      - name: Preview isolation in a real browser
        run: npm run test:isolation
      - name: Production build
        run: npm run build
      # One known low-severity finding remains: esbuild's dev *server* on Windows
      # (GHSA-g7r4-m6w7-qqqr), pinned ^0.27 by the deepspace CLI, which only calls
      # esbuild.build and never ships it to the worker or browser. Fail on moderate+.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
